name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: moodpress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows release as ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "moodpress-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: moodpress-windows-x64-zip
          path: moodpress-windows-x64.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - name: Set permanent Android application ID and configure API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_id = "nl.moodpress.app"
          gradle_files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          configured = False
          for path in gradle_files:
              if not path.exists():
                  continue
              content = path.read_text()
              if path.suffix == ".kts":
                  content, ns_count = re.subn(
                      r'(?m)^(\s*namespace\s*=\s*)["\'][^"\']+["\']',
                      rf'\1"{app_id}"',
                      content,
                  )
                  content, app_count = re.subn(
                      r'(?m)^(\s*applicationId\s*=\s*)["\'][^"\']+["\']',
                      rf'\1"{app_id}"',
                      content,
                  )
                  content = re.sub(
                      r"minSdk\s*=\s*flutter\.minSdkVersion",
                      "minSdk = 23",
                      content,
                  )
                  if ns_count and app_count:
                      configured = True
              else:
                  content, ns_count = re.subn(
                      r'(?m)^(\s*namespace\s+)["\'][^"\']+["\']',
                      rf'\1"{app_id}"',
                      content,
                  )
                  content, app_count = re.subn(
                      r'(?m)^(\s*applicationId\s+)["\'][^"\']+["\']',
                      rf'\1"{app_id}"',
                      content,
                  )
                  content = re.sub(
                      r"minSdkVersion\s+flutter\.minSdkVersion",
                      "minSdkVersion 23",
                      content,
                  )
                  if ns_count and app_count:
                      configured = True
              path.write_text(content)

          if not configured:
              raise SystemExit("Could not set Android namespace and applicationId to " + app_id)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          if "android.intent.action.TTS_SERVICE" not in xml:
              query = """    <queries>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          """
              xml = xml.replace("<application", query + "    <application", 1)
              manifest.write_text(xml)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: moodpress-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Build Android App Bundle (preview; signing still required for Play Store)
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: moodpress-android-aab-preview
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
